# Usado pelo job Jenkins "inspecta-api" (ci/Jenkinsfile), estágio "Build e testes".
# Só builda + testa a imagem e deixa ela tagueada no Docker do host (docker.sock
# compartilhado). Publish (docker push) e deploy (webhook) rodam depois, como
# estágios separados no Jenkinsfile, direto no agente -- não dependem deste compose.
# Opcionais: REGISTRY, IMAGE_NAME, IMAGE_TAG, CI_JWT_SECRET
name: inspecta-build-api

services:
  build-api:
    build:
      context: ..
      dockerfile: ci/Dockerfile.ci
    environment:
      REGISTRY: ${REGISTRY:-registry.inspecta.viniciusscarabelli.tech}
      IMAGE_NAME: ${IMAGE_NAME:-registry.inspecta.viniciusscarabelli.tech/inspecta-api}
      IMAGE_TAG: ${IMAGE_TAG:-latest}
      CI_JWT_SECRET: ${CI_JWT_SECRET:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
