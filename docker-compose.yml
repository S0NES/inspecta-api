# Inspecta — inspecta-api (API gateway: REST, auth JWT, RLS, webhooks, Flyway).
#
# inspecta-core é resolvido via Maven a partir do Reposilite (repositório interno no
# Dokploy) — o contexto de build é a própria pasta do inspecta-api, sem precisar clonar
# outros repos lado a lado nem usar git submodule.
#
#   cp .env.prod.example .env.prod && nano .env.prod
#   docker compose --env-file .env.prod up -d --build
#
# É o ÚNICO serviço que roda Flyway — suba ele antes de inspecta-worker/inspecta-messenger na
# primeira vez (as duas réplicas competem pelo lock do Flyway, isso é seguro).
#
# O inspecta-web agora é servido pelo Cloudflare Pages (não mais por este compose/Traefik) —
# ver DEPLOY_DOKPLOY.md § Cloudflare Pages. Por isso só existe uma rota abaixo
# (api.inspecta.viniciusscarabelli.tech); o inspecta-api aceita CORS em prod para o domínio do inspecta-web
# (inspecta.cors.allowed-origins / CORS_ALLOWED_ORIGINS no .env.prod).
name: inspecta-api

services:
  inspecta-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: registry.inspecta.viniciusscarabelli.tech/inspecta-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: ${TZ:-America/Sao_Paulo}
      JAVA_TOOL_OPTIONS: ${API_JAVA_OPTS:--XX:MaxRAMPercentage=70}
    deploy:
      # arquitetura.md: inspecta-api roda com 2 réplicas atrás do Traefik (round-robin).
      # VPS apertada? baixe para 1 aqui e refaça o `up -d`.
      replicas: 1
      resources:
        limits:
          memory: ${API_MEM_LIMIT:-1g}
    healthcheck:
      # /actuator/health é o único endpoint de actuator liberado sem auth
      # (SecurityConfig). NÃO use /actuator/health/readiness aqui: ele exige
      # autenticação e o healthcheck ficaria eternamente unhealthy.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dokploy-network
    labels:
      traefik.enable: "true"
      # O Traefik do template Hostinger roda em network_mode: host e descobre
      # containers pelo socket do Docker — não existe rede externa "traefik"
      # pra entrar. Com o container em UMA única rede (inspecta-net) a resolução
      # de IP é automática; traefik.docker.network não é necessário.

      # ---- Rota: subdomínio da API (api.inspecta.viniciusscarabelli.tech) -------
      # Único host do inspecta-api agora — inspecta-web chama direto (Cloudflare Pages não é
      # same-origin com o Dokploy). CORS cobre a origem do inspecta-web, ver topo do arquivo.
      traefik.http.routers.inspecta-api-api.rule: Host(`${API_HOST}`)
      traefik.http.routers.inspecta-api-api.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.inspecta-api-api.priority: "50"
      traefik.http.routers.inspecta-api-api.tls: "true"
      traefik.http.routers.inspecta-api-api.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.routers.inspecta-api-api.service: inspecta-api

      # ---- Serviço (load balancer entre as réplicas) ------------------------
      traefik.http.services.inspecta-api.loadbalancer.server.port: "8080"
      traefik.http.services.inspecta-api.loadbalancer.healthcheck.path: /actuator/health
      traefik.http.services.inspecta-api.loadbalancer.healthcheck.interval: 10s
      traefik.http.services.inspecta-api.loadbalancer.healthcheck.timeout: 5s

networks:
  dokploy-network:
    external: true
