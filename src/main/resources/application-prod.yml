# Profile prod: sem default de infra nem do JWT_SECRET — env var faltando derruba o boot
# (fail-fast), nunca sobe apontando pra localhost nem com o segredo de dev publico. Real
# HttpGateway fica ativo (saida HTTP de verdade para Pleno e demais integracoes).
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

inspecta:
  # URL base do SPA (inspecta-web) para links de e-mail (convite etc). Sem default em prod:
  # env faltando derruba o boot em vez de mandar link apontando pra localhost.
  app-url: ${INSPECTA_APP_URL}
  cors:
    # inspecta-web agora é Cloudflare Pages, não same-origin com o inspecta-api — fail-fast: sem
    # esta var, o boot cai em vez de subir com CORS aberto/errado silenciosamente.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: PT12H
  payment:
    provider: ${PAYMENT_PROVIDER}
  # inspecta.webhooks.* (autentique/abacatepay) migrou para o inspecta-messenger — ver inspecta-messenger/application-prod.yml.
  pleno:
    mode: ${PLENO_MODE}
    base-url: ${PLENO_BASE_URL}
    client-id: ${PLENO_CLIENT_ID}
    client-secret: ${PLENO_CLIENT_SECRET}
